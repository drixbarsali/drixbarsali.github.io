{% assign ad_client = site.adsense_client | default: "ca-pub-6360678037043874" %}
{% assign ad_slot = include.slot %}
{% if ad_slot and ad_slot != "" %}
<div class="ad-container" aria-label="Advertisement">
     <ins class="adsbygoogle" style="display:block" data-ad-client="{{ ad_client }}" data-ad-slot="{{ ad_slot }}"
          data-ad-format="{{ include.format | default: 'auto' }}" data-full-width-responsive="true"></ins>
     <script>
          (adsbygoogle = window.adsbygoogle || []).push({});
     </script>
</div>
{% endif %}
