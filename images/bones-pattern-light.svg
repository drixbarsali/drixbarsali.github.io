<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <!-- Single Bone Template -->
    <g id="single-bone">
      <path d="M -5,-30 C -9,-31 -16,-34 -17,-40 C -18,-47 -10,-50 -4,-46 C -1,-44 0,-40 0,-38 C 0,-40 1,-44 4,-46 C 10,-50 18,-47 17,-40 C 16,-34 9,-31 5,-30 L 5,30 C 9,31 16,34 17,40 C 18,47 10,50 4,46 C 1,44 0,40 0,38 C 0,40 -1,44 -4,46 C -10,50 -18,47 -17,40 C -16,34 -9,31 -5,30 Z" />
    </g>
    <!-- Crossed Bones Template -->
    <g id="crossed-bone">
      <use href="#single-bone" transform="rotate(45)" />
      <use href="#single-bone" transform="rotate(-45)" />
    </g>
  </defs>

  <!-- Light background matching theme -->
  <rect width="100%" height="100%" fill="#f4f5f8"/>

  <!-- Non-overlapping crossed bones with soft, subtle texture -->
  <!-- Primary crossed bones -->
  <use href="#crossed-bone" transform="translate(150, 150) scale(1.2) rotate(12)" fill="#94a3b8" opacity="0.10"/>
  <use href="#crossed-bone" transform="translate(550, 150) scale(1.1) rotate(-25)" fill="#94a3b8" opacity="0.08"/>
  <use href="#crossed-bone" transform="translate(350, 400) scale(1.3) rotate(35)" fill="#94a3b8" opacity="0.11"/>
  <use href="#crossed-bone" transform="translate(700, 400) scale(1.0) rotate(-15)" fill="#94a3b8" opacity="0.08"/>
  <use href="#crossed-bone" transform="translate(150, 620) scale(1.0) rotate(48)" fill="#94a3b8" opacity="0.10"/>
  <use href="#crossed-bone" transform="translate(550, 650) scale(1.15) rotate(-38)" fill="#94a3b8" opacity="0.09"/>

  <!-- Accent crossed bones positioned with clean separation -->
  <use href="#crossed-bone" transform="translate(380, 120) scale(0.7) rotate(-40)" fill="#64748b" opacity="0.08"/>
  <use href="#crossed-bone" transform="translate(100, 380) scale(0.75) rotate(20)" fill="#64748b" opacity="0.08"/>
  <use href="#crossed-bone" transform="translate(570, 380) scale(0.7) rotate(60)" fill="#64748b" opacity="0.07"/>
  <use href="#crossed-bone" transform="translate(350, 680) scale(0.8) rotate(-20)" fill="#64748b" opacity="0.08"/>
</svg>
